name: climate-platform

x-backend-common: &backend-common
  restart: unless-stopped
  build:
    context: ./backend
  env_file: .env
  volumes:
    - ./backend:/app
    # Recorte do Copernicus DEM (spec 008): baixado uma vez, fora do código.
    - dem-data:/data/dem
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 testa via TCP: na primeira inicialização a imagem sobe um servidor
      # temporário só no socket local, e sem -h o banco pareceria pronto antes da hora.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend-common
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "api"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend-common
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "worker"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  beat:
    <<: *backend-common
    command: celery -A app.workers.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "beat"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 60s

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    env_file: .env
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # Gravação dos dados do E2E (spec 011, FR-179). Só roda quando pedido:
  #   docker compose --profile e2e run --rm e2e-record
  e2e-record:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    working_dir: /app
    environment:
      E2E_RECORD: "1"
      E2E_BASE_URL: http://frontend:3000
    volumes:
      - ./frontend:/app
      - e2e-node-modules:/app/node_modules
    command: >-
      bash -c "npm ci --no-audit --no-fund
      && npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
      && npx playwright test"
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  db-data:
  dem-data:
  frontend-node-modules:
  frontend-next:
  e2e-node-modules:

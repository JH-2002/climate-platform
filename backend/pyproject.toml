[project]
name = "climate-platform-backend"
version = "0.1.0"
description = "Climate Intelligence Platform — API e workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6,<1",
    "uvicorn[standard]>=0.32.1,<1",
    "pydantic>=2.10.3,<3",
    "pydantic-settings>=2.6.1,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30.0,<1",
    "alembic>=1.14.0,<2",
    "redis>=5.2.1,<9",
    "celery[redis]>=5.4.0,<6",
    "structlog>=24.4.0",
    "httpx>=0.28.1,<1",
    "geoalchemy2>=0.15,<1",
    # fusos horários sem depender do tzdata do sistema (imagem slim)
    "tzdata>=2024.1",
    # Terreno (spec 008): leitura do Copernicus DEM; a wheel do rasterio já traz o GDAL
    "rasterio>=1.4,<2",
    "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<10",
    "pytest-cov>=6.0.0,<8",
    # ruff e mypy fixos: mudanças de versão alteram formatação e regras de tipagem
    "ruff==0.16.9",
    "mypy==1.13.0",
    "import-linter>=2.1,<3",
    "pip-audit>=2.7.3,<3",
    "celery-types>=0.22.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
# Textos em português usam legitimamente caracteres como "—", "º" e "…".
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "geoalchemy2.*", "rasterio.*", "affine.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Decorators e sinais do Celery são tipados só parcialmente (celery-types).
module = ["app.workers.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = [
    "integration: exige PostgreSQL/PostGIS, Redis e um worker Celery em execução",
]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core não pode depender de api nem de workers"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.workers"]

[[tool.importlinter.contracts]]
name = "integrações só interpretam dados: sem depender de ingestão, serviços, api ou workers"
type = "forbidden"
source_modules = ["app.integrations"]
forbidden_modules = ["app.ingestion", "app.services", "app.api", "app.workers", "app.models"]

[[tool.importlinter.contracts]]
name = "serviços e ingestão não dependem de api nem de workers"
type = "forbidden"
source_modules = ["app.services", "app.ingestion"]
forbidden_modules = ["app.api", "app.workers"]

[[tool.importlinter.contracts]]
name = "workers não podem depender de api"
type = "forbidden"
source_modules = ["app.workers"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "motor de risco é puro: sem modelos, serviços, ingestão, integrações, api ou workers"
type = "forbidden"
source_modules = ["app.risk"]
forbidden_modules = [
    "app.models",
    "app.services",
    "app.ingestion",
    "app.integrations",
    "app.api",
    "app.workers",
]

[[tool.importlinter.contracts]]
name = "cálculos de terreno são puros: sem modelos, serviços, ingestão, api ou workers"
type = "forbidden"
source_modules = ["app.geo"]
forbidden_modules = [
    "app.models",
    "app.services",
    "app.ingestion",
    "app.integrations",
    "app.api",
    "app.workers",
]

[[tool.importlinter.contracts]]
name = "motor de simulação é puro: só usa o motor de risco"
type = "forbidden"
source_modules = ["app.simulation"]
forbidden_modules = [
    "app.models",
    "app.services",
    "app.ingestion",
    "app.integrations",
    "app.api",
    "app.workers",
    "app.analytics",
]

[[tool.importlinter.contracts]]
name = "motor analítico é puro: sem modelos, serviços, ingestão, integrações, api ou workers"
type = "forbidden"
source_modules = ["app.analytics"]
forbidden_modules = [
    "app.models",
    "app.services",
    "app.ingestion",
    "app.integrations",
    "app.api",
    "app.workers",
]

[[tool.importlinter.contracts]]
name = "regras dos alertas são puras: sem modelos, serviços, ingestão, integrações, api ou workers"
type = "forbidden"
source_modules = ["app.alerts"]
forbidden_modules = [
    "app.models",
    "app.services",
    "app.ingestion",
    "app.integrations",
    "app.api",
    "app.workers",
]

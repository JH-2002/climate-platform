[project]
name = "climate-platform-backend"
version = "0.1.0"
description = "Climate Intelligence Platform — API e workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "celery[redis]==5.4.0",
    "structlog==24.4.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.3",
    "mypy==1.13.0",
    "import-linter==2.1",
    "pip-audit==2.7.3",
    "celery-types==0.22.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
# Textos em português usam legitimamente caracteres como "—", "º" e "…".
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Decorators e sinais do Celery são tipados só parcialmente (celery-types).
module = ["app.workers.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = [
    "integration: exige PostgreSQL/PostGIS, Redis e um worker Celery em execução",
]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core não pode depender de api nem de workers"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.workers"]

[[tool.importlinter.contracts]]
name = "workers não podem depender de api"
type = "forbidden"
source_modules = ["app.workers"]
forbidden_modules = ["app.api"]
